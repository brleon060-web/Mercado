<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>AJ Mercado</title>
</head>
<body>
    <h1>AJ MERCADO</h1>
    <div class="menu-nav">
        <a href="vendas.html" class="btn-nav">VENDAS</a>
        <a href="clientes.html" class="btn-nav">CLIENTES</a>
        <a href="produtos.html" class="btn-nav">PRODUTOS</a>
        <a href="salvamento.html" class="btn-nav" style="background:#444">⚙️</a>
    </div>
    <div class="container">
        <h2>Fiado a Receber</h2>
        <div id="dividaTotal" class="total-divida">R$ 0,00</div>
        <button onclick="DB.sync()" style="width:100%; background:#6f42c1">NUVEM: SINCRONIZAR AGORA</button>
    </div>
    <script src="app.js"></script>
    <script>
        const vendas = DB.get('vendas');
        const total = vendas.filter(v => v.tipo === 'fiado').reduce((acc, curr) => acc + curr.preco, 0);
        document.getElementById('dividaTotal').innerText = `R$ ${total.toFixed(2)}`;
    </script>
</body>
</html>
