<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Vendas - AJ Mercado</title>
</head>
<body>
    <div class="menu-nav"><a href="index.html" class="btn-nav">VOLTAR</a></div>
    <div class="container">
        <select id="selC"><option value="">Cliente...</option></select>
        <select id="selP"><option value="">Produto...</option></select>
        <div style="display:flex; gap:10px">
            <button onclick="vender('pago')" class="btn-success" style="flex:1">PAGO</button>
            <button onclick="vender('fiado')" class="btn-danger" style="flex:1">FIADO</button>
        </div>
        <h3>Histórico / Estorno</h3>
        <div id="listaV"></div>
    </div>
    <script src="app.js"></script>
    <script>
        let clientes = DB.get('clientes');
        let produtos = DB.get('produtos');
        let vendas = DB.get('vendas');

        document.getElementById('selC').innerHTML += clientes.map(c => `<option value="${c}">${c}</option>`).join('');
        document.getElementById('selP').innerHTML += produtos.map((p,i) => `<option value="${i}">${p.nome} (R$${p.preco})</option>`).join('');

        function vender(tipo) {
            const pi = document.getElementById('selP').value;
            const c = document.getElementById('selC').value;
            if(!c || pi==="") return;
            let p = produtos[pi];
            if(p.qtd <= 0) return alert("Sem estoque!");
            p.qtd--;
            vendas.unshift({ cliente: c, produto: p.nome, preco: p.preco, tipo: tipo, data: new Date().toLocaleString() });
            DB.set('produtos', produtos);
            DB.set('vendas', vendas);
            render();
        }

        function estornar(i) {
            if(confirm("Cancelar esta venda? O produto voltará ao estoque.")) {
                let v = vendas[i];
                let p = produtos.find(item => item.nome === v.produto);
                if(p) p.qtd++;
                vendas.splice(i, 1);
                DB.set('produtos', produtos);
                DB.set('vendas', vendas);
                render();
            }
        }

        function render() {
            document.getElementById('listaV').innerHTML = vendas.map((v, i) => `
                <div class="item-lista">
                    <div style="font-size:12px"><b>${v.cliente}</b><br>${v.produto} (${v.tipo})</div>
                    <button onclick="estornar(${i})" class="btn-danger">X</button>
                </div>
            `).join('');
        }
        render();
    </script>
</body>
</html>
